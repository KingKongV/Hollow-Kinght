<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Hollow Knight Standard Edition</title>
    <style>
      body { padding: 0; margin: 0; background-color: #000; overflow: hidden; }
      #unity-container { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
      canvas { width: 100%; height: 100%; background: #000; display: block; }
      #loading-text { position: absolute; color: #fff; font-family: sans-serif; font-size: 24px; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="loading-text">CONNECTING TO UNITY SERVER...</div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loadingText = document.querySelector("#loading-text");

      var buildUrl = "https://jsdelivr.net";
      var config = {
        dataUrl: buildUrl + "/HollowKnightWebGL.data",
        frameworkUrl: buildUrl + "/HollowKnightWebGL.framework.js",
        codeUrl: buildUrl + "/HollowKnightWebGL.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Team Cherry",
        productName: "Hollow Knight",
        productVersion: "1.5.78",
      };

      var script = document.createElement("script");
      script.src = "https://jsdelivr.net/HollowKnightWebGL.loader.js";
      script.crossOrigin = "anonymous";
      
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          loadingText.innerHTML = "LOADING GAME: " + Math.floor(progress * 100) + "%";
        }).then((unityInstance) => {
          loadingText.style.display = "none";
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
